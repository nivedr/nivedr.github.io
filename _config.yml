# Site settings
title: Nived Rajaraman
first_name: Nived
middle_name:
last_name: Rajaraman
contact_note:
description: >
  I am a postdoc at Microsoft Research NYC in the Reinforcement Learning group. I recently finished my PhD at UC Berkeley, advised by Jiantao Jiao and Kannan Ramchandran, affiliated with the BLISS and BAIR labs.
keywords: machine learning, reinforcement learning, language models, adaptive decision making
lang: en
icon: favicon.jpg
apple_touch_icon:

url: https://nivedr.github.io
baseurl:
last_updated: false
back_to_top: true

footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with
  <a href="https://github.com/alshedivat/al-folio" target="_blank">al-folio</a>.

# al-folio v1.2 runtime
al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false

# Layout
navbar_fixed: true
footer_fixed: false
max_width: 930px
search_enabled: true
socials_in_search: true
posts_in_search: false
bib_search: true

# Metadata and privacy
serve_og_meta: false
serve_schema_org: false
og_image:
protect_email: false
analytics:
  google:
  cronitor:
  pirsch:
  openpanel:
  cloudflare:
enable_simple_analytics: false
enable_cookie_consent: false

# Collections
collections:
  news:
    defaults:
      layout: post
    output: true

# Jekyll
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight

include: ["_pages"]
exclude:
  - AGENTS.md
  - al-folio-upgrade-report.md
  - bin/
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - README.md
  - STAGING.md
  - vendor/
keep_files:
  - CNAME
  - .nojekyll

theme: al_folio_core

plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji
  - al_folio_core
  - al_icons
  - al_folio_cv
  - al_folio_distill
  - al_folio_upgrade
  - al_folio_bootstrap_compat
  - al_cookie
  - al_analytics
  - al_citations
  - al_ext_posts
  - al_img_tools
  - al_search
  - al_charts
  - al_math
  - al_comments
  - al_newsletter
  - al_email_protect
  - al_marimo
  - al_rtl

defaults:
  - scope:
      path: assets
    values:
      sitemap: false

sass:
  style: compressed

jekyll-minifier:
  compress_javascript: false
  compress_css: false
  exclude: ["robots.txt"]

terser:
  compress:
    drop_console: true

# Publications
scholar:
  last_name: [Rajaraman, Rajaraman*, Rajaramanᵅ, Rajaraman*ᵅ]
  first_name: [Nived, N.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending

enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false

filtered_bibtex_keywords:
  [abbr, abstract, additional_info, annotation, bibtex_show, code, pdf, selected, tags, url, website]

max_author_limit:
more_authors_animation_delay: 10
enable_publication_thumbnails: false

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

imagemagick:
  enabled: true
  widths: [480, 800, 1400]
  input_directories: [assets/img/]
  input_formats: [".jpg", ".jpeg", ".png", ".tiff", ".gif"]
  output_formats:
    webp: "-auto-orient -quality 85"

lazy_loading_images: true
enable_darkmode: true
enable_navbar_social: false
enable_math: false
enable_medium_zoom: false
enable_progressbar: true

